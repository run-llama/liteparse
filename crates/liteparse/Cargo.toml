[package]
name = "liteparse"
version = "2.21.4"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Fast, lightweight PDF and document parsing with spatial text extraction"
readme = "README.md"

[lib]
name = "liteparse"

[[bin]]
name = "lit"
path = "src/main.rs"

[features]
# ocria-nano adds `lit models` and the opt-in backend; its models and ONNX Runtime are only
# downloaded by `lit models pull` (nothing is linked or bundled).
default = ["tesseract", "ocria-nano"]
oar-ocr = ["dep:oar-ocr"]
oar-ocr-auto-download = ["oar-ocr", "oar-ocr/auto-download"]
oar-ocr-cuda = ["oar-ocr", "oar-ocr/cuda"]
oar-ocr-tensorrt = ["oar-ocr", "oar-ocr/tensorrt"]
oar-ocr-directml = ["oar-ocr", "oar-ocr/directml"]
oar-ocr-coreml = ["oar-ocr", "oar-ocr/coreml"]
oar-ocr-webgpu = ["oar-ocr", "oar-ocr/webgpu"]
oar-ocr-openvino = ["oar-ocr", "oar-ocr/openvino"]
tesseract = ["dep:tesseract-rs"]
# LiteParse's own OCR models in-process; ONNX Runtime is loaded at run time, not linked.
ocria-nano = ["dep:ort", "dep:unicode-bidi", "dep:sha2", "dep:tar", "dep:zip"]
# ocria-nano in the WebAssembly build: the same engine on tract (pure Rust), models passed in
# as bytes (no `lit models pull`, no ONNX Runtime). Only takes effect on wasm32.
ocria-nano-wasm = ["dep:tract-onnx", "dep:getrandom", "dep:unicode-bidi", "dep:sha2"]
# Testing: run the native ocria-nano engine on tract instead of ONNX Runtime (WASM parity checks).
ocria-tract = ["ocria-nano", "dep:tract-onnx"]
# `lit ocr-serve`: ocria-nano as an HTTP OCR server (the `--ocr-server-url` protocol), so
# several parsing processes share one set of model sessions (one GPU).
ocr-serve = ["ocria-nano", "dep:axum", "tokio/net", "tokio/signal"]
# Debugging: write layout projection signals to the file LITEPARSE_PROJECTION_DUMP names.
projection-dump = []

[dependencies]
base64 = "0.22"
blake3 = "1"
clap = { version = "4.5.55", features = ["derive"] }
file-format = { version = "0.29.0", features = ["reader"] }
image = { version = "0.25", default-features = false, features = ["default-formats"] }
matrixmultiply = { version = "0.3", default-features = false, features = ["std"] }
memchr = "2"
ordered-float = "5.3.0"
pdfium = { package = "liteparse-pdfium", version = "1.15.0", path = "../pdfium" }
pdfium-sys = { package = "liteparse-pdfium-sys", version = "1.15.0", path = "../pdfium-sys" }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "form", "multipart", "rustls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tempfile = "3.27.0"
thiserror = "2"
tesseract-rs = { version = "0.4.2", features = ["build-tesseract"], optional = true }
tokio = { version = "1.52.3", features = ["rt", "macros", "sync", "time", "io-util"] }
url = "2"
unicode-bidi = { version = "0.3.18", optional = true }
sha2 = { version = "0.10.9", optional = true }
tract-onnx = { version = "0.23", optional = true }
web-time = "1.1.0"
flate2 = "1.1.9"
resvg = "0.44"
usvg = "0.44"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
lopdf = { version = "0.42", default-features = false }
oar-ocr = { version = "0.8", optional = true }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-24"], optional = true }
tar = { version = "0.4.46", default-features = false, optional = true }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "multipart", "json"], optional = true }
zip = { version = "9.8.1", default-features = false, features = ["deflate"], optional = true }
rmp = "0.8"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "fs", "process"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# tract-onnx-opl pulls rand -> getrandom, which in the browser needs its JS backend
getrandom = { version = "0.4", features = ["wasm_js"], optional = true }

[dev-dependencies]
serial_test = "3"
crc32fast = "1"
regex = "1"
