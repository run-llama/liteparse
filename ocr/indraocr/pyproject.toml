[project]
name = "indraocr-liteparse"
version = "0.1.0"
description = "Indra OCR server conforming to the LiteParse OCR API"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "indra-ocr>=0.3.1,<0.4.0",
    "fastapi>=0.131.0",
    "uvicorn>=0.41.0",
    "pillow>=10.2.0",
    "numpy>=1.26",
    "python-multipart>=0.0.22",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0",
    "pytest>=9.0.2",
]
