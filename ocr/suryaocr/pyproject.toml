[project]
name = "suryaocr-liteparse"
version = "0.1.0"
description = "Surya OCR 2 server conforming to the LiteParse OCR API"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "surya-ocr>=0.20.0,<0.21.0",
    "fastapi>=0.131.0",
    "uvicorn>=0.41.0",
    "pillow>=13.0.0",
    "python-multipart>=0.0.22",
]

[dependency-groups]
dev = [
    "httpx>=0.27.0,<0.28",
    "pytest>=9.0.2",
]

[tool.uv]
# surya-ocr pins pillow<11 and filelock<4, both of which carry open CVEs
# (patched in pillow 13.0.0 / filelock 4.2.1). Override to the patched lines.
override-dependencies = ["pillow>=13.0.0", "filelock>=4.2.1"]
