name: CI - WASM Bindings

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'packages/wasm/**'
      - 'scripts/browser-compat/**'
      - 'scripts/edge-compat/**'
      - '.cargo/**'
      - '.github/workflows/ci-wasm.yml'
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'packages/wasm/**'
      - 'scripts/browser-compat/**'
      - 'scripts/edge-compat/**'
      - '.cargo/**'
      - '.github/workflows/ci-wasm.yml'
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A new push to a pull request cancels that PR's older run of this workflow. Pushes to
# main and merge-queue runs get a group of their own (run_id), so they never queue
# behind or cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build WASM

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0 # 1.95.0
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/pdfium-rs
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Test WASM OCR stages
        env:
          NODE_PATH: ${{ github.workspace }}/scripts/browser-compat/stage-test-support
        run: wasm-pack test --node crates/liteparse-wasm --test ocr_stages

      - name: Build WASM package
        working-directory: packages/wasm
        run: npm run build

      - name: Verify output
        run: |
          test -f packages/wasm/pkg/liteparse_wasm_bg.wasm
          test -f packages/wasm/pkg/liteparse_wasm.js
          test -f packages/wasm/pkg/liteparse_wasm.d.ts
          WASM_SIZE=$(stat --format=%s packages/wasm/pkg/liteparse_wasm_bg.wasm)
          echo "WASM binary size: $(numfmt --to=iec $WASM_SIZE)"

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wasm-pkg
          path: packages/wasm/pkg/
          if-no-files-found: error

  browser-test:
    runs-on: ubuntu-latest
    needs: build
    name: Browser PDF parse test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Download WASM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-pkg
          path: packages/wasm/pkg/

      - name: Install Playwright
        run: |
          npm install playwright@latest
          npx playwright install --with-deps chromium

      - name: Run browser parse test
        run: node scripts/browser-compat/wasm-test.mjs

  edge-test:
    runs-on: ubuntu-latest
    needs: build
    name: Edge runtime PDF parse test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Download WASM artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wasm-pkg
          path: packages/wasm/pkg/

      - name: Install Miniflare
        # Pinned, NOT @latest: miniflare@latest currently resolves to a 5.x
        # alpha whose `new Miniflare()` options schema replaced the 4.x
        # single-worker form (`modules: [...]`) used by
        # scripts/edge-compat/wasm-test.mjs with a nested `workers: [...]`
        # shape. There is no root package.json/lockfile in this repo, so the
        # version has to live here. Bump deliberately, re-running the test.
        run: npm install --no-save miniflare@4.20260730.0

      - name: Run edge runtime parse test
        run: node scripts/edge-compat/wasm-test.mjs

      - name: Download ocria-nano models (Latin + LayoutNet)
        run: |
          mkdir -p ocria-models
          base=https://huggingface.co/llamaindex/OCRia-nano-1/resolve/v1.0.0
          for f in det.onnx det.meta.json router.onnx rec_latin.onnx rec_latin.charset.json tablenet.bin; do
            curl -fsSL --retry 3 "$base/$f" -o "ocria-models/$f"
          done

      - name: Run edge runtime OCR test (ocria-nano)
        env:
          OCRIA_MODELS: ocria-models
          EXPECT_TEXT: SUM
        run: node scripts/edge-compat/wasm-ocria-test.mjs integration_tests_data/receipt_scan.pdf

      - name: Run edge runtime OCR test on an image (ocria-nano, PNG input)
        env:
          OCRIA_MODELS: ocria-models
          EXPECT_TEXT: SUM
        run: node scripts/edge-compat/wasm-ocria-test.mjs integration_tests_data/receipt.png
