name: CI - Node Bindings

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packages/node/**"
      - ".github/workflows/ci-node.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packages/node/**"
      - ".github/workflows/ci-node.yml"
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            node-arch: darwin-arm64
            pdfium-dylib: libpdfium.dylib

          # Cross-compiled on Apple silicon: macos-latest builds this target in about half
          # the time of the Intel image (and with less variance). The x86_64 binary is
          # still tested on Intel (macos-26-intel) in the test job below.
          - os: macos-latest
            target: x86_64-apple-darwin
            node-arch: darwin-x64
            pdfium-dylib: libpdfium.dylib

          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            node-arch: linux-x64-gnu
            pdfium-dylib: libpdfium.so

          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            node-arch: linux-arm64-gnu
            pdfium-dylib: libpdfium.so

          - os: ubuntu-22.04
            target: x86_64-unknown-linux-musl
            node-arch: linux-x64-musl
            pdfium-dylib: libpdfium.so
            use-container: true

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            node-arch: win32-x64-msvc
            pdfium-dylib: pdfium.dll

          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            node-arch: win32-arm64-msvc
            pdfium-dylib: pdfium.dll

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.node-arch }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux glibc)
        if: runner.os == 'Linux' && !matrix.use-container
        run: |
          sudo apt-get update
          sudo apt-get install -y libtesseract-dev libleptonica-dev

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/pdfium-rs
            ~/Library/Caches/pdfium-rs
            target
          key: ${{ matrix.os }}-${{ matrix.target }}-cargo-node-${{ hashFiles('**/Cargo.lock') }}

      - name: Force Ninja generator (Windows)
        if: runner.os == 'Windows'
        run: echo "CMAKE_GENERATOR=Ninja" >> $GITHUB_ENV
        shell: bash

      - name: Install dependencies
        working-directory: packages/node
        run: npm install --ignore-scripts

      - name: Build native module
        if: ${{ !matrix.use-container }}
        working-directory: packages/node
        shell: bash
        run: npx napi build --cargo-cwd ../../crates/liteparse-napi --platform --release --js false --dts native.d.ts --target ${{ matrix.target }} .

      # tesseract-rs compiles leptonica + tesseract from C/C++ source into the container's
      # /root/.tesseract-rs, outside target/. Mount it from the host and cache it, keyed on
      # the tesseract-rs version, so the musl build stops recompiling it every run.
      - name: Read tesseract-rs version (musl)
        if: ${{ matrix.use-container }}
        id: tesseract-rs-musl
        shell: bash
        run: |
          v=$(grep -A1 '^name = "tesseract-rs"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache tesseract-rs build (musl)
        if: ${{ matrix.use-container }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.tesseract-rs-musl
          key: tesseract-rs-${{ matrix.os }}-${{ matrix.target }}-${{ steps.tesseract-rs-musl.outputs.version }}

      - name: Build native module (musl container)
        if: ${{ matrix.use-container }}
        run: |
          chmod +x scripts/build-musl-node.sh
          mkdir -p "$HOME/.tesseract-rs-musl"
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/work \
            -v "$HOME/.cargo/registry":/root/.cargo/registry \
            -v "$HOME/.cargo/git":/root/.cargo/git \
            -v "$HOME/.cache/pdfium-rs":/root/.cache/pdfium-rs \
            -v "$HOME/.tesseract-rs-musl":/root/.tesseract-rs \
            -w /work/packages/node \
            node:20-alpine \
            /work/scripts/build-musl-node.sh
          # The container runs as root. Hand its output back to the runner user, or the
          # actions/cache post step can't read ~/.cargo/registry and the save fails
          # ("tar: Cannot open: Permission denied"): this job never saved a cache.
          sudo chown -R "$(id -u):$(id -g)" "$HOME/.cargo/registry" "$HOME/.cargo/git" \
            "$HOME/.cache/pdfium-rs" "$HOME/.tesseract-rs-musl" "$GITHUB_WORKSPACE"

      - name: Copy pdfium dylib (Unix)
        if: runner.os != 'Windows'
        working-directory: packages/node
        run: bash scripts/copy-pdfium.sh .

      - name: Copy pdfium dylib (Windows)
        if: runner.os == 'Windows'
        working-directory: packages/node
        shell: pwsh
        run: |
          $cacheBase = "$env:LOCALAPPDATA\pdfium-rs"
          if (-not (Test-Path $cacheBase)) {
            $cacheBase = "$env:USERPROFILE\.cache\pdfium-rs"
          }
          $dll = Get-ChildItem -Path $cacheBase -Recurse -Filter "pdfium.dll" | Select-Object -First 1
          if ($dll) {
            Copy-Item $dll.FullName -Destination ".\pdfium.dll"
            Write-Host "Copied $($dll.FullName) -> .\pdfium.dll"
          } else {
            Write-Error "Could not find pdfium.dll in cache"
            exit 1
          }

      - name: Build TypeScript
        working-directory: packages/node
        run: npm run build:ts

      - name: Upload artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bindings-${{ matrix.node-arch }}
          path: |
            packages/node/*.node
            packages/node/${{ matrix.pdfium-dylib }}
            packages/node/libc++.so.1
            packages/node/libc++abi.so.1
            packages/node/libunwind.so.1
            packages/node/libgcc_s.so.1
          if-no-files-found: warn

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            node-arch: darwin-arm64
          - os: macos-26-intel
            node-arch: darwin-x64
          - os: ubuntu-22.04
            node-arch: linux-x64-gnu
          - os: ubuntu-22.04
            node-arch: linux-x64-musl
            use-container: true
          - os: windows-latest
            node-arch: win32-x64-msvc
          - os: windows-11-arm
            node-arch: win32-arm64-msvc
    runs-on: ${{ matrix.os }}
    name: Test ${{ matrix.node-arch }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: packages/node
        shell: bash
        # Drop the published @llamaindex/liteparse-<platform> optional deps: the
        # loader prefers them over a local .node, so tests would otherwise run
        # against the last release instead of the binary built from this commit.
        run: |
          npm install --ignore-scripts
          rm -rf node_modules/@llamaindex/liteparse-*

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bindings-${{ matrix.node-arch }}
          path: packages/node

      - name: Build TypeScript
        working-directory: packages/node
        run: npm run build:ts

      - name: Test ESM + CJS entry points
        if: ${{ !matrix.use-container }}
        working-directory: packages/node
        run: npm test

      - name: Smoke test (musl container)
        if: ${{ matrix.use-container }}
        run: |
          chmod +x scripts/smoke-test-musl-node.sh
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/work \
            -w /work/packages/node \
            node:20-alpine \
            /work/scripts/smoke-test-musl-node.sh
