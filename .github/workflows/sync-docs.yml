name: Sync Docs to Developer Hub
on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

# The push to the docs repo uses DEVELOPER_HUB_TOKEN, not GITHUB_TOKEN.
permissions:
  contents: read

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0

      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@6a52aad76a94a5fbc50d567bb5be24419801c1fb # nightly

      - name: Install rustdoc-md
        run: cargo install rustdoc-md

      - name: Checkout docs repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: run-llama/developers
          token: ${{ secrets.DEVELOPER_HUB_TOKEN }}
          path: developer-hub

      - name: Generate API docs
        run: ./scripts/generate-api-docs.sh

      - name: Sync docs
        run: ./scripts/sync-docs-to-developer-hub.sh developer-hub

      - name: Commit and push
        working-directory: developer-hub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/docs/liteparse
          if git diff --staged --quiet; then
            echo "No docs changes to sync."
            exit 0
          fi
          SOURCE_SHA="${GITHUB_SHA::8}"
          git commit -m "sync: liteparse docs from run-llama/liteparse@${SOURCE_SHA}"
          git push
