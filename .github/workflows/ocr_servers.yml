name: Validate OCR Servers

on:
  pull_request:

permissions:
  contents: read

jobs:
  testing_paddleocr:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Run Tests on Main Package
        run: uv run pytest test_server.py
        working-directory: ocr/paddleocr/

  testing_easyocr:
    runs-on: ubuntu-latest
    strategy:
