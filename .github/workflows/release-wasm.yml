name: Release - WASM

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 2.1.0)'
        required: true
        type: string
      beta:
        description: 'Publish as beta (npm tag: beta instead of latest)'
        type: boolean
        default: false
      dry-run:
        description: 'Dry run (build but do not publish)'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Validate version
        run: |
          PKG_VERSION=$(node -p "require('./packages/wasm/package.json').version")
          if [ "$PKG_VERSION" != "${{ inputs.version }}" ]; then
            echo "::error::Version mismatch: package.json has $PKG_VERSION, expected ${{ inputs.version }}"
            exit 1
          fi
          echo "Version validated: ${{ inputs.version }}"

  build:
    needs: validate
    runs-on: ubuntu-latest
    name: Build WASM

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0 # 1.95.0
        with:
          targets: wasm32-unknown-unknown

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/pdfium-rs
            target
          key: ${{ runner.os }}-cargo-wasm-release-${{ hashFiles('**/Cargo.lock') }}

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      - name: Build WASM package
        working-directory: packages/wasm
        run: npm run build

      - name: Verify output
        run: |
          test -f packages/wasm/pkg/liteparse_wasm_bg.wasm
          test -f packages/wasm/pkg/liteparse_wasm.js
          test -f packages/wasm/pkg/liteparse_wasm.d.ts

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wasm-pkg
          path: packages/wasm/pkg/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    name: Publish to npm

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # npm trusted publishing (OIDC) requires npm >= 11.5.1
      - name: Update npm
        run: npm install -g npm@latest

      - name: Download WASM artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wasm-pkg
          path: packages/wasm/pkg

      - name: Publish
        if: ${{ !inputs.dry-run }}
        working-directory: packages/wasm
        env:
          NPM_TAG: ${{ inputs.beta && 'beta' || 'latest' }}
        run: npm publish --access public --provenance --tag "$NPM_TAG" --ignore-scripts

      - name: Create git tag
        if: ${{ !inputs.dry-run }}
        run: |
          git tag "wasm-v${{ inputs.version }}"
          git push origin "wasm-v${{ inputs.version }}"

      - name: Create GitHub Release
        if: ${{ !inputs.dry-run }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: wasm-v${{ inputs.version }}
          name: "WASM v${{ inputs.version }}"
          generate_release_notes: true

      - name: Summary (dry run)
        if: ${{ inputs.dry-run }}
        run: |
          echo "## Dry Run Summary" >> $GITHUB_STEP_SUMMARY
          echo "Would release wasm-v${{ inputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "### Package: @llamaindex/liteparse-wasm" >> $GITHUB_STEP_SUMMARY
          WASM_SIZE=$(stat --format=%s packages/wasm/pkg/liteparse_wasm_bg.wasm)
          echo "WASM binary size: $(numfmt --to=iec $WASM_SIZE)" >> $GITHUB_STEP_SUMMARY
