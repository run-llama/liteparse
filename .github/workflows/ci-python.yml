name: CI - Python Bindings

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packages/python/**"
      - ".github/workflows/ci-python.yml"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "packages/python/**"
      - ".github/workflows/ci-python.yml"
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin

          - os: macos-26-intel
            target: x86_64-apple-darwin

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu

          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu

          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            musl: true

          - os: windows-latest
            target: x86_64-pc-windows-msvc

          - os: windows-11-arm
            target: aarch64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.target }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@1961bfc0c4a8bf07e0a0c98e1e2459c642ea70a0 # 1.95.0
        with:
          targets: ${{ matrix.target }}

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux' && !matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y libtesseract-dev libleptonica-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install tesseract leptonica

      - name: Force Ninja generator (Windows)
        if: runner.os == 'Windows'
        run: echo "CMAKE_GENERATOR=Ninja" >> $GITHUB_ENV
        shell: bash

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cache/pdfium-rs
            ~/Library/Caches/pdfium-rs
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-python-${{ hashFiles('**/Cargo.lock') }}

      # tesseract-rs's build script compiles leptonica + tesseract from C/C++ source and keeps
      # the result outside target/, so the cargo cache above never covers it and every build
      # recompiled it (4-10 min on macOS Intel, even on a cargo cache hit). Keyed on the
      # tesseract-rs version alone, so ordinary Cargo.lock changes still hit. Linux wheels
      # build inside the manylinux / Alpine containers, which do not use this directory.
      - name: Read tesseract-rs version
        if: runner.os != 'Linux'
        id: tesseract-rs
        shell: bash
        run: |
          v=$(grep -A1 '^name = "tesseract-rs"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
          test -n "$v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache tesseract-rs build
        if: runner.os != 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/Library/Application Support/tesseract-rs
            ~/AppData/Roaming/tesseract-rs
          key: tesseract-rs-${{ matrix.os }}-${{ matrix.target }}-${{ steps.tesseract-rs.outputs.version }}

      - name: Stage pdfium for wheel inclusion
        if: ${{ !matrix.musl }}
        shell: bash
        # Stage the library before maturin builds the wheel so packaging does
        # not depend on Cargo's internal build directory layout.
        run: bash packages/python/scripts/download-pdfium.sh ${{ matrix.target }}

      - name: Build wheels (glibc)
        if: ${{ !matrix.musl }}
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          manylinux: 2_28
          working-directory: packages/python
          before-script-linux: |
            if command -v yum &> /dev/null; then
              yum install -y tesseract-devel leptonica-devel openssl-devel pkgconfig perl-IPC-Cmd || true
            elif command -v apt-get &> /dev/null; then
              apt-get update && apt-get install -y libtesseract-dev libleptonica-dev libssl-dev pkg-config || true
            elif command -v apk &> /dev/null; then
              apk add tesseract-ocr-dev leptonica-dev openssl-dev pkgconf || true
            fi

      - name: Build wheels (musl container)
        if: ${{ matrix.musl }}
        # Same pattern as the node musl build: run inside a vanilla
        # python:3-alpine with clang+libc++ from apk. Bypasses maturin-action's
        # musllinux_1_2 cross image, which causes FORTIFY_SOURCE issues with
        # tesseract's C++ build and broken host-openssl for build-deps.
        run: |
          chmod +x scripts/build-musl-py.sh
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/work \
            -v "$HOME/.cargo/registry":/root/.cargo/registry \
            -v "$HOME/.cargo/git":/root/.cargo/git \
            -v "$HOME/.cache/pdfium-rs":/root/.cache/pdfium-rs \
            -w /work \
            python:3.12-alpine \
            /work/scripts/build-musl-py.sh
          # The container runs as root; fix perms so subsequent steps can
          # read/upload the produced wheel.
          sudo chmod -R a+rw packages/python/dist/ || true

      - name: Upload wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.target }}
          path: packages/python/dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
          working-directory: packages/python

      - name: Upload sdist
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: packages/python/dist/*.tar.gz
          if-no-files-found: error

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-26-intel
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use-container: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    name: Test ${{ matrix.target }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Download wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-${{ matrix.target }}
          path: dist

      - name: Install wheel
        if: ${{ !matrix.use-container }}
        run: pip install --no-index --find-links dist liteparse

      - name: Smoke test
        if: ${{ !matrix.use-container }}
        run: |
          python -c "
          from liteparse import LiteParse, ParseResult, ParsedPage, TextItem, ScreenshotResult
          parser = LiteParse(ocr_enabled=False, quiet=True)
          print('LiteParse loaded successfully')
          print(repr(parser))
          "

      - name: Parse test
        if: ${{ !matrix.use-container }}
        run: |
          python -c "
          from liteparse import LiteParse
          parser = LiteParse(ocr_enabled=False, quiet=True, max_pages=2)
          result = parser.parse('demo/docs/apple-10k-2024.pdf')
          assert result.num_pages == 2, f'Expected 2 pages, got {result.num_pages}'
          assert len(result.text) > 0, 'Expected non-empty text'
          page = result.get_page(1)
          assert page is not None, 'Expected page 1'
          assert len(page.text_items) > 0, 'Expected text items'
          print(f'Parsed {result.num_pages} pages, {len(result.text)} chars')
          print('Parse test passed')
          "

      - name: Bytes parse test
        if: ${{ !matrix.use-container }}
        run: |
          python -c "
          from liteparse import LiteParse
          parser = LiteParse(ocr_enabled=False, quiet=True, max_pages=1)
          with open('demo/docs/apple-10k-2024.pdf', 'rb') as f:
              data = f.read()
          result = parser.parse(data)
          assert result.num_pages == 1
          assert len(result.text) > 0
          print('Bytes parse test passed')
          "

      - name: Screenshot test
        if: ${{ !matrix.use-container }}
        run: |
          python -c "
          from liteparse import LiteParse
          parser = LiteParse(ocr_enabled=False, quiet=True)
          screenshots = parser.screenshot('demo/docs/apple-10k-2024.pdf', page_numbers=[1])
          assert len(screenshots) == 1
          assert screenshots[0].page_num == 1
          assert len(screenshots[0].image_bytes) > 0
          print(f'Screenshot: {screenshots[0].width}x{screenshots[0].height}, {len(screenshots[0].image_bytes)} bytes')
          print('Screenshot test passed')
          "

      - name: CLI test
        if: ${{ !matrix.use-container }}
        run: |
          lit --version
          lit parse demo/docs/apple-10k-2024.pdf --no-ocr --max-pages 1 -q | head -5
          echo "CLI test passed"

      - name: Test in musl container
        if: ${{ matrix.use-container }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE":/work \
            -w /work \
            python:3.12-alpine \
            sh -c '
              pip install --no-index --find-links dist liteparse
              python -c "
          from liteparse import LiteParse, ParseResult, ParsedPage, TextItem, ScreenshotResult
          parser = LiteParse(ocr_enabled=False, quiet=True)
          print(repr(parser))
          print(\"LiteParse loaded successfully\")
          "
              python -c "
          from liteparse import LiteParse
          parser = LiteParse(ocr_enabled=False, quiet=True, max_pages=2)
          result = parser.parse(\"demo/docs/apple-10k-2024.pdf\")
          assert result.num_pages == 2, f\"Expected 2 pages, got {result.num_pages}\"
          assert len(result.text) > 0, \"Expected non-empty text\"
          print(f\"Parsed {result.num_pages} pages, {len(result.text)} chars\")
          print(\"Parse test passed\")
          "
              lit --version
              lit parse demo/docs/apple-10k-2024.pdf --no-ocr --max-pages 1 -q | head -5
              echo "CLI test passed"
            '
